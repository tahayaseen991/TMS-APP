name: View Shipments CI

# Trigger workflow on push or pull request to any branch
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install GCC (if not present)
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Step 3: Compile view_shipments module with its test
      - name: Compile view_shipments Test
        run: gcc view_shipments.c test-cases/view_shipments_tests.c -o view_shipments_test

      # Step 4: Run the test executable
      - name: Run view_shipments Test
        run: ./view_shipments_test
